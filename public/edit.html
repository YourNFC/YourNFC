<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b09">
  <title>My profile | YourNFC </title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand-container"><div class="brand">Your<span>NFC</span></div></div>
  <button class="btn btn-secondary" id="logout" type="button">Log out</button>
</header>

<main class="page">
  <section class="section">
    <h2>Profile photo</h2>
    <div class="photo-row">
      <img class="avatar" id="avatar" alt="Profile photo" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' fill='%23222419'/%3E%3Ccircle cx='60' cy='43' r='22' fill='%23c9a227'/%3E%3Cpath d='M18 120c3-29 19-43 42-43s39 14 42 43' fill='%23c9a227'/%3E%3C/svg%3E">
      <div>
        <input id="photoInput" type="file" accept="image/jpeg,image/png,image/webp" hidden>
        <button class="btn btn-secondary" id="photoBtn" type="button">Upload photo</button>
        <button class="btn btn-danger" id="photoDel" type="button">Remove</button>
        <p class="edit-hint" style="margin:10px 0 0">JPG, PNG or WebP, up to 3 MB.</p>
      </div>
    </div>
    <p class="msg" id="photoMsg"></p>
  </section>

  <form class="section" id="form">
    <h2>Your details</h2>
    <div class="form-grid">
      <div class="field"><label for="name">Name</label><input id="name" maxlength="80"></div>
      <div class="field"><label for="profession">Profession</label><input id="profession" maxlength="120"></div>
      <div class="field full"><label for="bio">Bio</label><textarea id="bio" maxlength="1000"></textarea></div>
      <div class="field"><label for="location">Location</label><input id="location" maxlength="120"></div>
      <div class="field"><label for="website">Website</label><input id="website" maxlength="200" placeholder="yourwebsite.com"></div>
      <div class="field"><label for="email">Email</label><input id="email" type="email" maxlength="120"></div>
      <div class="field"><label for="phone">Phone</label><input id="phone" type="tel" maxlength="40"></div>
      <div class="field"><label for="company">Company / School</label><input id="company" maxlength="120"></div>
      <div class="field"><label for="interests">Interests</label><input id="interests" maxlength="200"></div>
      <div class="field full"><label for="available">Available for</label><input id="available" maxlength="200"></div>
    </div>

    <h2 style="margin-top:26px">Social links</h2>
    <p class="edit-hint">Paste the full link. Leave blank to hide it.</p>
    <div class="form-grid">
      <div class="field"><label for="instagram">Instagram</label><input id="instagram" maxlength="300" placeholder="https://instagram.com/you"></div>
      <div class="field"><label for="facebook">Facebook</label><input id="facebook" maxlength="300" placeholder="https://facebook.com/you"></div>
      <div class="field"><label for="tiktok">TikTok</label><input id="tiktok" maxlength="300" placeholder="https://tiktok.com/@you"></div>
      <div class="field"><label for="linkedin">LinkedIn</label><input id="linkedin" maxlength="300" placeholder="https://linkedin.com/in/you"></div>
    </div>

    <p class="msg" id="msg"></p>
    <div class="actions">
      <button class="btn btn-primary" id="save" type="submit">Save changes</button>
    </div>
  </form>

  <form class="section" id="pwForm">
    <h2>Change password</h2>
    <div class="form-grid">
      <div class="field"><label for="curPw">Current password</label><input id="curPw" type="password" autocomplete="current-password"></div>
      <div class="field"><label for="newPw">New password (8+ characters)</label><input id="newPw" type="password" minlength="8" autocomplete="new-password"></div>
    </div>
    <p class="msg" id="pwMsg"></p>
    <div class="actions">
      <button class="btn btn-secondary" type="submit">Update password</button>
    </div>
  </form>

  <footer>POWERED BY <span style="color:var(--gold-light)">YourNFC</span> · TAP. CONNECT. BEYOND</footer>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const FIELDS = ['name','profession','bio','location','website','email','phone','company','interests','available','instagram','facebook','tiktok','linkedin'];
  const DEFAULT_AVATAR = $('avatar').src;
  let username = '';

  function say(id, text, ok) {
    const el = $(id);
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.textContent = text;
  }

  async function api(url, opts) {
    const r = await fetch(url, opts);
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { location.href = '/login'; throw new Error('Please log in.'); }
    if (!r.ok) throw new Error(j.error || 'Something went wrong.');
    return j;
  }

  function fill(p) {
    FIELDS.forEach((k) => { $(k).value = p[k] || ''; });
    $('avatar').src = p.photo ?  p.photo : DEFAULT_AVATAR;
  }

  async function load() {
    const j = await api('/api/me');
    username = j.username;
    fill(j.profile || {});
  }
  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('save').disabled = true;
    try {
      const body = {};
      FIELDS.forEach((k) => { body[k] = $(k).value; });
      const j = await api('/api/me', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      fill(j.profile);
      say('msg', 'Saved! Going back to your profile.', true);
      setTimeout(() => {location.href = '/u/' + username; }, 800);
    } catch (err) {
      say('msg', err.message, false);
    }
    $('save').disabled = false;
  });

  $('photoBtn').addEventListener('click', () => $('photoInput').click());
  $('photoInput').addEventListener('change', async () => {
    const f = $('photoInput').files[0];
    if (!f) return;
    try {
      const fd = new FormData();
      fd.append('photo', f);
      const j = await api('/api/me/photo', { method: 'POST', body: fd });
      $('avatar').src = j.photo;
      say('photoMsg', 'Photo updated.', true);
    } catch (err) {
      say('photoMsg', err.message, false);
    }
    $('photoInput').value = '';
  });

  $('photoDel').addEventListener('click', async () => {
    try {
      await api('/api/me/photo', { method: 'DELETE' });
      $('avatar').src = DEFAULT_AVATAR;
      say('photoMsg', 'Photo removed.', true);
    } catch (err) {
      say('photoMsg', err.message, false);
    }
  });

  $('pwForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      await api('/api/me/password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ current: $('curPw').value, next: $('newPw').value })
      });
      $('curPw').value = '';
      $('newPw').value = '';
      say('pwMsg', 'Password changed.', true);
    } catch (err) {
      say('pwMsg', err.message, false);
    }
  });

  $('logout').addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' }).catch(() => {});
    location.href = '/login';
  });

  load().catch((err) => say('msg', err.message, false));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0c0c">
  <title>Log in | YourNFC.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand-container"><div class="brand">Your<span>NFC</span></div></div>
  <div class="top-note">TAP. CONNECT. BEYOND.</div>
</header>

<main class="narrow">
  <section class="section">
    <h2 id="title">Log in</h2>
    <p class="edit-hint" id="hint">Log in to edit your digital profile.</p>
    <form id="form" autocomplete="on">
      <div class="field" id="nameWrap" style="display:none; margin-bottom:14px">
        <label for="name">Full name</label>
        <input id="name" maxlength="80" autocomplete="name">
      </div>
      <div class="field" style="margin-bottom:14px">
        <label for="username">Username</label>
        <input id="username" required autocomplete="username" autocapitalize="none" spellcheck="false">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required minlength="8" autocomplete="current-password">
      </div>
      <p class="msg" id="msg"></p>
      <div class="actions">
        <button class="btn btn-primary" id="submit" type="submit">Log in</button>
        <button class="btn btn-secondary" id="toggle" type="button" style="display:none">Create account</button>
      </div>
    </form>
  </section>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let mode = 'login';

  function setMode(m) {
    mode = m;
    const signup = m === 'signup';
    $('title').textContent = signup ? 'Create account' : 'Log in';
    $('hint').textContent = signup
      ? 'Pick a username. It becomes your profile link: /u/username'
      : 'Log in to edit your digital profile.';
    $('nameWrap').style.display = signup ? '' : 'none';
    $('submit').textContent = signup ? 'Sign up' : 'Log in';
    $('toggle').textContent = signup ? 'I have an account' : 'Create account';
    $('password').autocomplete = signup ? 'new-password' : 'current-password';
    $('msg').textContent = '';
  }

  fetch('/api/config').then((r) => r.json()).then((c) => {
    if (c.signup) $('toggle').style.display = '';
  }).catch(() => {});

  $('toggle').addEventListener('click', () => setMode(mode === 'login' ? 'signup' : 'login'));

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = $('msg');
    msg.className = 'msg';
    msg.textContent = '';
    $('submit').disabled = true;
    try {
      const body = { username: $('username').value, password: $('password').value };
      if (mode === 'signup') body.name = $('name').value;
      const r = await fetch(mode === 'signup' ? '/api/signup' : '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(j.error || 'Something went wrong.');
      location.href = '/u/' + body.username.toLowerCase().trim();
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = err.message;
      $('submit').disabled = false;
    }
  });
</script>
</body>
</html>

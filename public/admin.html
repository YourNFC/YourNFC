<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090b09">
  <meta name="robots" content="noindex">
  <title>Admin | YourNFC.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand-container"><div class="brand">Your<span>NFC</span> Admin</div></div>
  <div class="top-note">Customer accounts</div>
</header>

<main class="page">
  <form class="section" id="keyForm">
    <h2>Admin key</h2>
    <p class="edit-hint">Enter the ADMIN_KEY from your server settings. It is kept only in this tab.</p>
    <div class="field"><label for="key">Admin key</label><input id="key" type="password" autocomplete="off"></div>
    <p class="msg" id="keyMsg"></p>
    <div class="actions"><button class="btn btn-primary" type="submit">Unlock</button></div>
  </form>

  <div id="panel" style="display:none">
    <form class="section" id="createForm">
      <h2>Create customer account</h2>
      <div class="form-grid">
        <div class="field"><label for="cUser">Username</label><input id="cUser" required autocapitalize="none" spellcheck="false"></div>
        <div class="field"><label for="cName">Customer name</label><input id="cName" maxlength="80"></div>
        <div class="field full"><label for="cPw">Temporary password (8+ characters)</label><input id="cPw" type="text" minlength="8" required autocomplete="off"></div>
      </div>
      <p class="msg" id="createMsg"></p>
      <div class="actions"><button class="btn btn-primary" type="submit">Create account</button></div>
    </form>

    <section class="section">
      <h2>Customers</h2>
      <p class="msg" id="listMsg"></p>
      <div style="overflow-x:auto">
        <table class="users">
          <thead><tr><th>Username</th><th>Name</th><th>Link</th><th>Actions</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>
  </div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let KEY = '';

  function say(id, text, ok) {
    const el = $(id);
    el.className = 'msg ' + (ok ? 'ok' : 'err');
    el.textContent = text;
  }

  async function api(url, method, body) {
    const r = await fetch(url, {
      method: method || 'GET',
      headers: Object.assign({ 'x-admin-key': KEY }, body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || 'Something went wrong.');
    return j;
  }

  function btn(label, cls, onClick) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ' + cls;
    b.style.padding = '7px 12px';
    b.textContent = label;
    b.addEventListener('click', onClick);
    return b;
  }

  async function loadUsers() {
    const users = await api('/api/admin/users');
    const tbody = $('rows');
    tbody.textContent = '';
    if (!users.length) say('listMsg', 'No accounts yet.', true);
    else $('listMsg').textContent = '';

    users.forEach((u) => {
      const tr = document.createElement('tr');

      const tdUser = document.createElement('td');
      tdUser.textContent = u.username;

      const tdName = document.createElement('td');
      tdName.textContent = u.name || '';

      const tdLink = document.createElement('td');
      const a = document.createElement('a');
      a.href = '/u/' + encodeURIComponent(u.username);
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = '/u/' + u.username;
      tdLink.appendChild(a);

      const tdAct = document.createElement('td');
      tdAct.style.whiteSpace = 'nowrap';
      tdAct.appendChild(btn('Reset password', 'btn-secondary', async () => {
        const pw = prompt('New password for ' + u.username + ' (8+ characters):');
        if (!pw) return;
        try {
          await api('/api/admin/users/' + encodeURIComponent(u.username) + '/password', 'POST', { password: pw });
          say('listMsg', 'Password changed for ' + u.username + '.', true);
        } catch (err) { say('listMsg', err.message, false); }
      }));
      tdAct.appendChild(document.createTextNode(' '));
      tdAct.appendChild(btn('Delete', 'btn-danger', async () => {
        if (!confirm('Delete ' + u.username + '? This removes their account and profile.')) return;
        try {
          await api('/api/admin/users/' + encodeURIComponent(u.username), 'DELETE');
          await loadUsers();
          say('listMsg', 'Deleted ' + u.username + '.', true);
        } catch (err) { say('listMsg', err.message, false); }
      }));

      tr.append(tdUser, tdName, tdLink, tdAct);
      tbody.appendChild(tr);
    });
  }

  $('keyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    KEY = $('key').value;
    try {
      await loadUsers();
      $('panel').style.display = '';
      $('keyForm').style.display = 'none';
    } catch (err) {
      KEY = '';
      say('keyMsg', err.message, false);
    }
  });

  $('createForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    try {
      const j = await api('/api/admin/users', 'POST', {
        username: $('cUser').value,
        password: $('cPw').value,
        name: $('cName').value
      });
      say('createMsg', 'Created. Their link: ' + location.origin + '/u/' + j.username, true);
      $('cUser').value = '';
      $('cName').value = '';
      $('cPw').value = '';
      await loadUsers();
    } catch (err) {
      say('createMsg', err.message, false);
    }
  });
</script>
</body>
</html>
